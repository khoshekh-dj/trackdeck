name: macOS build

on:
  push:
    branches: [main]
    tags: ["trackdeck-v*"]
    # the website and docs don't affect the app (tags always build)
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TrackDeck.dmg (${{ matrix.title }})
    strategy:
      fail-fast: false # one chip's failure shouldn't cancel the other's build
      matrix:
        include:
          # GitHub retired its macOS 14 runners, so this .dmg also needs macOS 15
          - runner: macos-15
            title: Apple Silicon
            label: AppleSilicon
          # Intel build; the .dmg needs at least the runner's macOS (15)
          - runner: macos-15-intel
            title: Intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # only used on tag pushes, to attach the .dmg to the release
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#trackdeck-v}"
          changelog=$(head -1 ChangeLog | awk '{print $2}' | tr -d ',')
          version_file=$(tr -d '[:space:]' < VERSION)
          echo "tag: $want | ChangeLog: $changelog | VERSION: $version_file"
          if [ "$want" != "$changelog" ] || [ "$want" != "$version_file" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match ChangeLog ($changelog) / VERSION ($version_file). Merge the version bump first, then tag that commit."
            exit 1
          fi

      - name: Install dependencies
        run: |
          brew install qt@5 gstreamer taglib imagemagick librsvg pkgconf ffmpeg aubio
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: ./configure

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Package
        run: |
          scripts/package-mac.sh "$PWD/TrackDeck.app" "$PWD/dist/TrackDeck"
          codesign --verify --strict dist/TrackDeck/TrackDeck.app

      - name: Smoke test packaged app
        run: |
          # starts Qt from inside the bundle (platform plugin, frameworks) and exits
          version=$(dist/TrackDeck/TrackDeck.app/Contents/MacOS/TrackDeck --version)
          echo "TrackDeck reports version: $version"
          test -n "$version"
          test -f dist/TrackDeck/TrackDeck.app/Contents/Resources/Licenses/TrackDeck/LICENSE.GPL3
          test -f dist/TrackDeck/TrackDeck.app/Contents/Resources/skins/modern.nzs

      - name: Format test (play each audio format in the packaged app)
        env:
          # Homebrew's GStreamer has no WavPack plugin
          EXPECTED_MISSING: wavpack.wv
        run: scripts/test-formats.sh dist/TrackDeck/TrackDeck.app Contents/MacOS/TrackDeck "$RUNNER_TEMP/formats"

      - name: Upload format test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: format-test-logs-macos-${{ matrix.label }}
          path: ${{ runner.temp }}/formats/logs
          if-no-files-found: ignore

      - name: Name artifact
        id: name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            label="${GITHUB_REF_NAME#trackdeck-v}"
          else
            label="$(git rev-parse --short HEAD)"
          fi
          file="TrackDeck-${label}-macOS-${{ matrix.label }}.dmg"
          mv dist/TrackDeck.dmg "dist/$file"
          (cd dist && shasum -a 256 "$file" | tee "$file.sha256")
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: |
            dist/${{ steps.name.outputs.file }}
            dist/${{ steps.name.outputs.file }}.sha256
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # attach to an existing release for this tag, or create a draft one
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "TrackDeck ${GITHUB_REF_NAME#trackdeck-v}" \
              --notes "Built by GitHub Actions from \`$GITHUB_REF_NAME\`." \
              || gh release view "$GITHUB_REF_NAME" >/dev/null  # created meanwhile by the other workflow
          fi
          gh release upload "$GITHUB_REF_NAME" "dist/${{ steps.name.outputs.file }}" \
            "dist/${{ steps.name.outputs.file }}.sha256" --clobber
